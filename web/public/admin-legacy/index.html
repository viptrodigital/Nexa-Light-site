<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NexaLight Admin | Control Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0a0a0a",
                        accent: "#777777",
                        background: "#f8f8f6",
                        surface: "#ebebe6",
                        surfaceLight: "#f0f0eb",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    }
                }
            }
        }
    
    </script>
    <style>
        body {
            background-color: #f8f8f6;
            color: #0a0a0a;
            font-family: 'Inter', sans-serif;
        }

        .admin-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .admin-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .admin-scroll::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .admin-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .toast-msg {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0a0a0a;
            color: #fff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            animation: toastFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastFadeIn {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes toastFadeOut {
            to {
                transform: translateY(20px);
                opacity: 0;
            }
        }
    </style>
</head>

<body class="antialiased overflow-x-hidden min-h-screen">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-0 right-0 p-6 z-[1000] pointer-events-none flex flex-col gap-3"></div>

    <!-- Login View -->
    <div id="login-view" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-primary">
        <div class="max-w-md w-full">
            <div class="text-center mb-10 flex flex-col items-center justify-center">
                <img src="../images/logo.png" alt="NexaLight Logo" class="h-10 w-auto mb-4 invert brightness-[10]">
                <p class="text-white/40 text-xs uppercase tracking-widest font-semibold">Administrative Access Only</p>
            </div>
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-10 rounded-2xl">
                <form id="admin-login-form" onsubmit="handleLogin(event)" class="space-y-6">
                    <div>
                        <label class="block text-white/60 text-xs font-semibold uppercase tracking-widest mb-2">Email</label>
                        <input type="email" id="admin-id" required autocomplete="username"
                            class="w-full bg-white/5 border border-white/10 rounded-lg py-3.5 px-4 text-white focus:outline-none focus:ring-2 focus:ring-accent transition-all text-sm"
                            placeholder="Enter admin email...">
                    </div>
                    <div>
                        <label
                            class="block text-white/60 text-xs font-semibold uppercase tracking-widest mb-2">Password</label>
                        <input type="password" id="admin-pass" required autocomplete="current-password"
                            class="w-full bg-white/5 border border-white/10 rounded-lg py-3.5 px-4 text-white focus:outline-none focus:ring-2 focus:ring-accent transition-all text-sm"
                            placeholder="Enter password...">
                    </div>
                    <div id="login-error"
                        class="text-red-400 text-xs hidden text-center font-medium bg-red-950/20 py-2.5 rounded-lg border border-red-900/30">
                        Invalid credentials. Please try again.
                    </div>
                    <button type="submit"
                        class="w-full bg-accent text-primary font-semibold py-4 rounded-lg hover:bg-opacity-95 transition-all active:scale-[0.98] text-sm uppercase tracking-wider">
                        Authenticate
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Layout (Hidden initially) -->
    <div id="admin-layout" class="hidden min-h-[100svh] flex text-primary relative">

        <!-- Sidebar Navigation -->
        <div id="admin-sidebar"
            class="w-64 bg-white border-r border-black/5 flex flex-col fixed h-full z-40 shadow-premium transition-transform duration-300 -translate-x-full lg:translate-x-0">
            <div class="p-6 border-b border-black/5 flex items-center justify-between">
                <img src="../images/logo.png" alt="NexaLight Logo" class="h-8 w-auto">
                <button onclick="toggleSidebar()"
                    class="lg:hidden text-secondary hover:text-primary text-xl font-bold p-1 leading-none">&times;</button>
            </div>
            <div class="flex-1 py-6 flex flex-col gap-2 px-4 admin-scroll overflow-y-auto" id="admin-nav">
                <button onclick="switchTab('dashboard')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3 active bg-surfaceLight text-primary shadow-sm">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    Dashboard
                </button>
                <button onclick="switchTab('products')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                    Products
                </button>
                <button onclick="switchTab('categories')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
                        </path>
                    </svg>
                    Categories
                </button>
                <button onclick="switchTab('gallery')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    Gallery
                </button>
                <button onclick="switchTab('blogs')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15"></path>
                    </svg>
                    Blogs
                </button>
                <button onclick="switchTab('seo')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    SEO Settings
                </button>
                <button onclick="switchTab('settings')"
                    class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors text-secondary hover:bg-surfaceLight hover:text-primary flex items-center gap-3">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                        </path>
                    </svg>
                    Settings
                </button>
            </div>
            <div class="p-4 border-t border-black/5 bg-surfaceLight/50">
                <button onclick="logout()"
                    class="w-full flex items-center justify-center gap-2 text-red-600 bg-white border border-red-100 hover:bg-red-50 rounded-lg py-3 text-sm font-medium transition-colors shadow-sm">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    Secure Logout
                </button>
            </div>
        </div>

        <!-- Sidebar Overlay (mobile/tablet) -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-35 opacity-0 pointer-events-none transition-opacity duration-300"></div>

        <!-- Main Workspace Wrapper -->
        <div class="flex-1 lg:ml-64 min-h-screen flex flex-col" id="admin-main-wrapper">
            <!-- Mobile Navigation Bar -->
            <header
                class="lg:hidden flex items-center justify-between px-6 py-4 bg-white border-b border-black/5 sticky top-0 z-20">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="text-primary hover:text-accent p-1">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <img src="../images/logo.png" alt="NexaLight Logo" class="h-6 w-auto">
                </div>
            </header>

            <div class="flex-1 p-4 sm:p-6 md:p-8 lg:p-12 overflow-y-auto" id="admin-main-content">
                <!-- Content loaded dynamically here -->
            </div>
        </div>

    </div>

    <!-- Admin Modal Container -->
    <div id="admin-modal-container"
        class="fixed inset-0 z-[100] hidden bg-black/50 flex items-center justify-center p-4 sm:p-6 md:p-8 backdrop-blur-sm">
    </div>

    <!-- Image Crop Modal -->
    <div id="crop-modal" class="fixed inset-0 z-[110] hidden bg-black/80 flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-2xl w-full max-w-3xl overflow-hidden flex flex-col shadow-2xl h-[80vh]">
            <div class="p-4 border-b border-black/10 flex justify-between items-center bg-surfaceLight">
                <h3 class="text-xl font-semibold text-primary">Crop Image</h3>
                <button type="button" onclick="closeCropModal()" class="text-secondary hover:text-primary font-bold text-xl">&times;</button>
            </div>
            <div class="flex-1 bg-black overflow-hidden flex items-center justify-center relative">
                <img id="cropper-image" src="" alt="Image for cropping" class="max-w-full max-h-full block opacity-0">
            </div>
            <div class="p-4 border-t border-black/10 bg-surfaceLight flex justify-end gap-4">
                <button type="button" onclick="closeCropModal()" class="px-6 py-2 rounded-lg text-sm font-semibold bg-white border border-black/10 text-secondary">Cancel</button>
                <button type="button" onclick="confirmCrop()" class="px-6 py-2 rounded-lg text-sm font-semibold bg-primary text-white hover:bg-black/80">Crop & Save</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin-v2.js?v=8"></script>
</body>

</html>
